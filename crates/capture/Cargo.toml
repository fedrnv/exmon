[package]
name = "exmon-capture"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
exmon-domain.workspace = true
serial2 = { version = "0.2.39", features = ["rs4xx"] }
socket2 = "0.6.5"
pcap = { version = "2.5", optional = true }
hidapi = { version = "2.6.7", optional = true, default-features = false, features = ["windows-native", "linux-native-basic-udev"] }
nusb = { version = "0.2.9", optional = true }

[features]
native-pcap = ["dep:pcap"]
native-hid = ["dep:hidapi"]
native-usb = ["dep:nusb"]
native-usbmon = ["dep:rustix"]
native-can = ["dep:socketcan"]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", optional = true, features = ["fs"] }
socketcan = { version = "4.0.0", optional = true, default-features = false }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "ethernet_smoke"
required-features = ["native-pcap"]
