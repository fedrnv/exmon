[package]
name = "exmon-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
exmon-app.workspace = true
exmon-domain.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[features]
native-hid = ["exmon-app/native-hid"]
