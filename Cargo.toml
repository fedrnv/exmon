[workspace]
members = ["crates/domain", "crates/capture", "crates/protocol", "crates/storage", "crates/app", "crates/gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
exmon-domain = { path = "crates/domain" }
exmon-capture = { path = "crates/capture" }
exmon-protocol = { path = "crates/protocol" }
exmon-storage = { path = "crates/storage" }
exmon-app = { path = "crates/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
