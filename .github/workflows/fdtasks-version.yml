name: FDTasks version allocator

on:
  push:
    branches: [main]
    paths:
      - 'Tasks/version-requests/*.json'
      - '.github/workflows/fdtasks-version.yml'
      - 'scripts/fdtasks-version-allocator.mjs'
      - 'scripts/publish-fdtasks-versions.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdtasks-version-allocator
  cancel-in-progress: false

jobs:
  allocate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Allocate versions and publish ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-fdtasks-versions.mjs
