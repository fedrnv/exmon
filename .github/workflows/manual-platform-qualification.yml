name: Manual platform qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-platform-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            backend: vulkan
          - runner: macos-15
            machine: arm64
            backend: metal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      WGPU_BACKEND: ${{ matrix.backend }}
      EXMON_EXPECTED_MACHINE: ${{ matrix.machine }}
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install reference toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Prepare isolated Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libx11-6 libxcursor1 libxi6 libxrandr2 libxinerama1 libxkbcommon-x11-0 libwayland-client0 libegl1 libgl1-mesa-dri libvulkan1 vulkan-tools mesa-vulkan-drivers libpcap-dev
          mkdir -p target/platform-qualification
          nohup Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp > target/platform-qualification/xvfb.log 2>&1 < /dev/null &
          for attempt in $(seq 1 30); do
            test -S /tmp/.X11-unix/X99 && break
            sleep 1
          done
          test -S /tmp/.X11-unix/X99
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Run bounded synthetic qualification
        run: python3 .github/scripts/platform_qualification.py
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-${{ matrix.runner }}-${{ github.sha }}
          path: target/platform-qualification/
          retention-days: 1
          if-no-files-found: warn
